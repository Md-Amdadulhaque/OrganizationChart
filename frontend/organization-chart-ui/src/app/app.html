<mat-toolbar color="primary">
    <span>Organization Chart System</span>

    @if (auth.isAuthenticated()) {
        <span class="toolbar-spacer"></span>
        <span class="toolbar-user">
            {{ auth.username() }}
            <span class="toolbar-role">({{ auth.role() }})</span>
        </span>
        <button mat-button (click)="logout()">Logout</button>
    }
</mat-toolbar>

@if (auth.isAuthenticated()) {

    <mat-sidenav-container class="layout">

        <mat-sidenav mode="side" opened>

            <mat-nav-list>

                <a mat-list-item routerLink="/dashboard">
                    Dashboard
                </a>

                <a mat-list-item routerLink="/departments">
                    Departments
                </a>

                <a mat-list-item routerLink="/users">
                    Users
                </a>

                @if (auth.isAdmin()) {
                    <a mat-list-item routerLink="/import">
                        Import
                    </a>
                }

                <a mat-list-item routerLink="/organization-chart">
                    Organization Chart
                </a>

            </mat-nav-list>

        </mat-sidenav>

        <mat-sidenav-content>

            <div class="content">

                <router-outlet></router-outlet>

            </div>

        </mat-sidenav-content>

    </mat-sidenav-container>

} @else {

    <div class="content">
        <router-outlet></router-outlet>
    </div>

}
